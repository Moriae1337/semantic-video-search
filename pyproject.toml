[project]
name = "svs"
version = "0.1.0"
description = "Semantic video search: find moments in videos with a text query"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# ML stack. torch is installed separately for CUDA (see README), this pulls the CPU build by default.
ml = [
    "torch>=2.7",
    "open_clip_torch>=2.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads a real model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
